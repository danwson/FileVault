# Todas as portas publicadas abaixo são vinculadas explicitamente a
# 127.0.0.1 (localhost). Sem isso, o Docker publica por padrão em 0.0.0.0
# (todas as interfaces), o que deixaria MySQL/Redis/MinIO alcançáveis por
# qualquer outra máquina na mesma rede — indesejado, já que essas senhas
# são de desenvolvimento.
services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: filevault_app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
    env_file:
      - .env
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - filevault

  webserver:
    image: nginx:1.27-alpine
    container_name: filevault_webserver
    restart: unless-stopped
    ports:
      - "127.0.0.1:${APP_PORT:-8000}:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/up"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - filevault

  mysql:
    image: mysql:8.4
    container_name: filevault_mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
    ports:
      - "127.0.0.1:${FORWARD_DB_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - filevault

  redis:
    image: redis:7-alpine
    container_name: filevault_redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:${FORWARD_REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - filevault

  minio:
    image: minio/minio:latest
    container_name: filevault_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "127.0.0.1:${FORWARD_MINIO_PORT:-9000}:9000"
      - "127.0.0.1:${FORWARD_MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks:
      - filevault

  # Cria o bucket padrão automaticamente ao subir o ambiente, usando o
  # cliente oficial do MinIO. Roda uma vez e sai (não fica em restart loop).
  minio-init:
    image: minio/mc:latest
    container_name: filevault_minio_init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD; do sleep 1; done;
      mc mb --ignore-existing local/$$MINIO_BUCKET;
      exit 0;
      "
    env_file:
      - .env
    networks:
      - filevault

volumes:
  mysql_data:
  minio_data:

networks:
  filevault:
    driver: bridge
